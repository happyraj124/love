<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROTOCOL: SOULMATE // OVERRIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #ff00ff;
            --danger: #ff2a2a;
            --success: #00ff66;
            --bg: #050510;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Orbitron', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: crosshair; /* Custom crosshair cursor */
            user-select: none;
        }

        /* --- BACKGROUND LAYERS --- */
        canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        #star-canvas { z-index: 0; }
        #trail-canvas { z-index: 15; mix-blend-mode: screen; }

        /* Retro Grid Floor */
        .grid-floor {
            position: fixed;
            bottom: -30%;
            left: -50%;
            width: 200%;
            height: 100%;
            background-image: 
                linear-gradient(transparent 0%, var(--primary) 2px, transparent 3px),
                linear-gradient(90deg, transparent 0%, var(--primary) 2px, transparent 3px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: moveGrid 5s linear infinite;
            opacity: 0.2;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes moveGrid {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Vignette & Scanlines */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,1) 100%);
            background-size: 100% 4px, 100% 100%;
        }

        /* --- HUD UI --- */
        .hud-container {
            position: relative;
            z-index: 20;
            text-align: center;
            width: 90%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Decorative Brackets */
        .hud-container::before, .hud-container::after {
            content: '';
            position: absolute;
            width: 50px; height: 50px;
            border: 2px solid var(--primary);
            transition: all 0.5s ease;
        }
        .hud-container::before { top: 0; left: 0; border-bottom: none; border-right: none; }
        .hud-container::after { bottom: 0; right: 0; border-top: none; border-left: none; }

        .glitch-text {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            letter-spacing: 5px;
            margin-bottom: 10px;
            position: relative;
        }

        .sub-text {
            font-family: 'Share Tech Mono', monospace;
            color: var(--primary);
            font-size: 1.2rem;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .gif-display {
            width: 160px; height: 160px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            overflow: hidden;
            margin-bottom: 20px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .gif-display img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* --- BUTTONS --- */
        .controls {
            display: flex;
            gap: 40px;
            margin-top: 10px;
            position: relative; 
        }

        button {
            background: transparent;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 15px 40px;
            border: 2px solid var(--primary);
            position: relative;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2);
            /* Important: Ensure buttons are above the canvas trail */
            z-index: 30; 
        }

        button:hover {
            background: rgba(0, 243, 255, 0.1);
            text-shadow: 0 0 8px white;
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(-2px);
        }

        #btn-no {
            border-color: var(--secondary);
            box-shadow: inset 0 0 15px rgba(255, 0, 255, 0.2);
        }
        
        #btn-no:hover {
            box-shadow: 0 0 20px var(--secondary);
            background: rgba(255, 0, 255, 0.1);
        }

        /* --- STATES --- */
        .alert-mode .glitch-text { text-shadow: 0 0 20px var(--danger); color: white; }
        .alert-mode .sub-text { color: var(--danger); }
        .alert-mode .hud-container::before, .alert-mode .hud-container::after { border-color: var(--danger); }
        .alert-mode .grid-floor { background-image: linear-gradient(transparent 0%, var(--danger) 2px, transparent 3px), linear-gradient(90deg, transparent 0%, var(--danger) 2px, transparent 3px); opacity: 0.4; }

        .hidden { display: none !important; }
        
        #success-view h1 {
            color: var(--success);
            text-shadow: 0 0 30px var(--success);
        }
        
        /* Mobile Scaling */
        @media (max-width: 600px) {
            .glitch-text { font-size: 1.8rem; letter-spacing: 2px; }
            .controls { gap: 15px; }
            button { padding: 12px 20px; font-size: 0.9rem; }
            .gif-display { width: 120px; height: 120px; }
        }

    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>
    <canvas id="trail-canvas"></canvas>
    
    <div class="grid-floor"></div>
    <div class="overlay"></div>

    <div class="hud-container" id="main-hud">
        <div class="gif-display" id="hud-gif">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3R6bXc5aDJ6bmF2YjF6Z3Z5bXF6bXc5aDJ6bmF2YjF6Z3Z5bXF6bCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute">
        </div>

        <h1 class="glitch-text" id="main-title" data-text="INITIATE LOVE?">INITIATE LOVE?</h1>
        <p class="sub-text" id="system-msg">SYSTEM: AWAITING INPUT...</p>

        <div class="controls">
            <button id="btn-yes" onclick="acceptLove()">AFFIRMATIVE</button>
            <button id="btn-no" onclick="rejectLove()">NEGATIVE</button>
        </div>
    </div>

    <div class="hud-container hidden" id="success-view">
        <div class="gif-display" style="border-color: var(--success); box-shadow: 0 0 40px var(--success);">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExa3V5cTZ1eG15bXc5aDJ6bmF2YjF6Z3Z5bXF6bXc5aDJ6bmF2YjF6Z3Z5bCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/T86i6yDyOYz7J6dPhf/giphy.gif" alt="Love">
        </div>
        <h1 class="glitch-text">ACCESS GRANTED</h1>
        <p class="sub-text" style="color: var(--success);">PROTOCOL: SOULMATE CONNECTED ❤️</p>
    </div>

    <script>
        // --- 1. SETUP CANVAS ---
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');
        const trailCanvas = document.getElementById('trail-canvas');
        const trailCtx = trailCanvas.getContext('2d');

        let width, height;
        let stars = [];
        let particles = [];
        let warpSpeed = 2;
        let isRedAlert = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            starCanvas.width = width;
            starCanvas.height = height;
            trailCanvas.width = width;
            trailCanvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 2. STARS ENGINE ---
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width - width / 2;
                this.y = Math.random() * height - height / 2;
                this.z = Math.random() * 1000; 
            }
            update() {
                this.z -= warpSpeed;
                if (this.z < 1) {
                    this.reset();
                    this.z = 1000;
                }
            }
            draw() {
                const x = (this.x / this.z) * width + width / 2;
                const y = (this.y / this.z) * height + height / 2;
                const radius = (1 - this.z / 1000) * 3;

                starCtx.beginPath();
                starCtx.fillStyle = isRedAlert ? "#ffaaaa" : "white";
                starCtx.arc(x, y, radius, 0, Math.PI * 2);
                starCtx.fill();
            }
        }

        // --- 3. CURSOR PARTICLE ENGINE (THE NEW PART) ---
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.life = 1;
                // Color changes based on alert status
                this.color = isRedAlert ? `255, 0, 0` : `0, 243, 255`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.03;
            }
            draw() {
                trailCtx.fillStyle = `rgba(${this.color}, ${this.life})`;
                trailCtx.beginPath();
                trailCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                trailCtx.fill();
            }
        }

        // Mouse/Touch Tracker
        function handleInput(x, y) {
            // Spawn 2 particles per movement event
            particles.push(new Particle(x, y));
            particles.push(new Particle(x, y));
        }

        document.addEventListener('mousemove', (e) => handleInput(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            handleInput(touch.clientX, touch.clientY);
        });

        // --- 4. MAIN ANIMATION LOOP ---
        for(let i=0; i<400; i++) stars.push(new Star());

        function animate() {
            // Clear Canvases
            starCtx.fillStyle = "rgba(5, 5, 16, 0.4)"; // Trails for stars
            starCtx.fillRect(0, 0, width, height);
            
            trailCtx.clearRect(0, 0, width, height);

            // Update & Draw Stars
            stars.forEach(star => { star.update(); star.draw(); });

            // Update & Draw Particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animate);
        }
        animate();


        // --- 5. GAME LOGIC ---
        let denialLevel = 0;
        const btnNo = document.getElementById('btn-no');
        const title = document.getElementById('main-title');
        const sysMsg = document.getElementById('system-msg');
        const body = document.body;
        let isEvasionActive = false;

        const messages = [
            "ERROR: INCORRECT CHOICE",
            "WARNING: HEARTBREAK IMMINENT",
            "CRITICAL: LOVE IS INEVITABLE",
            "SYSTEM FAILURE: DENIAL OVERLOAD",
            "FATAL: LOCKING CONTROLS"
        ];

        function rejectLove() {
            denialLevel++;
            
            // Hacker Text Effect
            scrambleText(title, title.getAttribute('data-text'));

            // Escalation Levels
            if(denialLevel <= 5) {
                warpSpeed = 2 + (denialLevel * 3); // Faster stars
                sysMsg.innerText = messages[denialLevel - 1];
                
                // Red Alert Mode
                if(denialLevel >= 3) {
                    body.classList.add('alert-mode');
                    isRedAlert = true; // Changes star & particle color
                }
            }

            // ACTIVATE RUNAWAY MODE
            if(denialLevel >= 5 && !isEvasionActive) {
                activateEvasion();
            }
        }

        function activateEvasion() {
            isEvasionActive = true;
            sysMsg.innerText = "⛔ TARGET LOCKED: EVASION PROTOCOL ACTIVE";
            btnNo.innerText = "CATCH ME";
            
            // Move button to body to fix positioning
            document.body.appendChild(btnNo);
            
            const rect = btnNo.getBoundingClientRect();
            btnNo.style.position = 'fixed';
            btnNo.style.left = rect.left + 'px';
            btnNo.style.top = rect.top + 'px';
            btnNo.style.zIndex = 1000;
            btnNo.style.transition = 'top 0.2s ease-out, left 0.2s ease-out'; 

            // Add hover listeners
            btnNo.addEventListener('mouseover', moveButton);
            btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });
        }

        function moveButton() {
            if(!isEvasionActive) return;

            const padding = 20;
            const btnW = btnNo.offsetWidth;
            const btnH = btnNo.offsetHeight;
            const maxX = window.innerWidth - btnW - padding;
            const maxY = window.innerHeight - btnH - padding;

            const newX = Math.max(padding, Math.random() * maxX);
            const newY = Math.max(padding, Math.random() * maxY);

            btnNo.style.left = newX + 'px';
            btnNo.style.top = newY + 'px';
            
            // Random Border Color
            btnNo.style.borderColor = Math.random() > 0.5 ? '#ff0000' : '#ff00ff';
        }

        function acceptLove() {
            if(isEvasionActive) btnNo.style.display = 'none';
            
            document.getElementById('main-hud').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
            body.classList.remove('alert-mode');
            isRedAlert = false;
            
            warpSpeed = 1;
            confetti({
                particleCount: 250,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#00ff66', '#00f3ff', '#ffffff']
            });
        }

        // --- 6. TEXT SCRAMBLER ---
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890@#$%&";
        function scrambleText(element, finalValue) {
            let iterations = 0;
            const interval = setInterval(() => {
                element.innerText = finalValue.split("")
                    .map((letter, index) => {
                        if(index < iterations) return finalValue[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    }).join("");
                
                if(iterations >= finalValue.length) clearInterval(interval);
                iterations += 1/3;
            }, 30);
        }

    </script>
</body>
</html>
